name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest tests/unit -q

  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aurora
          POSTGRES_PASSWORD: aurora
          POSTGRES_DB: aurora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aurora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AURORA_DATABASE_URL: postgresql+psycopg://aurora:aurora@localhost:5432/aurora
      AURORA_REDIS_URL: redis://localhost:6379/0
      AURORA_USE_INMEMORY_QUEUE: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Apply migrations
        run: alembic upgrade head

      - name: Start Core
        run: |
          uvicorn aurora_core.main:create_app --factory --host 127.0.0.1 --port 8000 &
          echo $! > core.pid

      - name: Wait for Core readiness
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health/ready; then
              echo "Core ready"; exit 0
            fi
            sleep 2
          done
          echo "Core did not become ready in time"; exit 1

      - name: Run integration tests
        env:
          AURORA_INTEGRATION_BASE_URL: http://127.0.0.1:8000
        run: pytest tests/integration -m integration -q

      - name: Stop Core
        if: always()
        run: |
          if [ -f core.pid ]; then kill "$(cat core.pid)" || true; fi
